# PolyON Drive — PRC-based Module Manifest
apiVersion: polyon.io/v1
kind: Module

metadata:
  id: drive
  name: PP Drive
  version: "0.1.1"
  category: engine
  description: "파일 스토리지 서비스 (WebDAV, 공유, 휴지통, 버전)"
  icon: Document
  accent: "#0082C9"
  vendor: "Triangle.s"
  license: MIT

spec:
  engine: drive

  requires:
    - id: postgresql
    - id: rustfs
    - id: samba-dc

  resources:
    image: jupitertriangles/polyon-drive:v0.1.1
    replicas: 1
    ports:
      - name: http
        containerPort: 8080
    health:
      path: /health
      port: 8080
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # ── PRC: Platform Resource Claims ──
  claims:
    - type: database
      config:
        name: drive
    - type: objectStorage
      config:
        bucket: drive
    - type: directory
      config:
        ou: drive

  # ── 환경변수 (PRC credential 템플릿) ──
  env:
    DATABASE_URL: "{{ claims.database.url }}"
    S3_ENDPOINT: "{{ claims.objectStorage.endpoint }}"
    S3_BUCKET: "{{ claims.objectStorage.bucket }}"
    S3_ACCESS_KEY: "{{ claims.objectStorage.accessKey }}"
    S3_SECRET_KEY: "{{ claims.objectStorage.secretKey }}"
    LDAP_URL: "{{ claims.directory.url }}"
    LDAP_BIND_DN: "{{ claims.directory.bindDN }}"
    LDAP_BIND_PASSWORD: "{{ claims.directory.bindPassword }}"
    LDAP_BASE_DN: "{{ claims.directory.baseDN }}"
    S3_REGION: "us-east-1"
    RUST_LOG: "info"

  ingress:
    subdomain: drive
    port: 8080

  # ── Console Admin 페이지 ──
  console:
    menuGroup: services
    adminPath: /admin
    pages:
      - id: overview
        title: "개요"
        icon: Dashboard
        path: overview
        default: true
      - id: storage
        title: "스토리지"
        icon: DataBase
        path: storage
      - id: quota
        title: "할당량"
        icon: Meter
        path: quota
      - id: activity
        title: "활동 로그"
        icon: Activity
        path: activity
      - id: settings
        title: "설정"
        icon: Settings
        path: settings

  # ── Portal 사원 페이지 ──
  portal:
    menuGroup: apps
    userPath: /
    pages:
      - id: files
        title: "드라이브"
        icon: Folder
        path: ""
        default: true
      - id: shared
        title: "공유"
        icon: Share
        path: shared
      - id: recent
        title: "최근"
        icon: RecentlyViewed
        path: recent
      - id: favorites
        title: "즐겨찾기"
        icon: Star
        path: favorites
      - id: trash
        title: "휴지통"
        icon: TrashCan
        path: trash

  uninstall:
    confirm: true
    dataPolicy: ask
